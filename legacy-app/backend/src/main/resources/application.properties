# VidaPlus - configuracao (LEGADO)
# V-05: segredos hardcoded (senha do banco e do JWT no repositorio).
#       Os grupos devem migrar para variaveis de ambiente / cofre e
#       o gate de secret scanning (Gitleaks) deve acusar estas linhas.

server.port=8080

spring.datasource.url=jdbc:mysql://db:3306/vidaplus?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=vidaplus
spring.datasource.password=vidaplus123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# V-05: segredo do JWT fixo no arquivo
vidaplus.jwt.secret=vidaplus-secret-123

# V-11: erros verbosos (stack trace vaza ao cliente)
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true
