# VidaPlus - ambiente completo
# Stack atual: MySQL 8.4 + backend (Java 21 / Spring Boot 3) + frontend (React 19 / Vite -> nginx).
# O "legado" e so o contexto narrativo; as falhas estao no codigo/design.
# ATENCAO: credenciais em texto claro de proposito (V-05) - discutir gestao de segredos.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: vidaplus
      MYSQL_USER: vidaplus
      MYSQL_PASSWORD: vidaplus123   # V-05
    ports:
      - "3306:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"     # V-13: HTTP puro
    environment:
      # No legado, a app le do application.properties (hardcoded). Os grupos
      # migram para estas variaveis e removem os segredos do codigo.
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/vidaplus?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: vidaplus
      SPRING_DATASOURCE_PASSWORD: vidaplus123

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"     # nginx serve o build do Vite na porta 80 do container

# Usuarios de teste, endpoints e falhas exploraveis: ver README.md deste diretorio.
