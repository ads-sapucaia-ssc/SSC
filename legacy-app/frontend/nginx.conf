# VidaPlus (LEGADO) — nginx serve o build estatico do React Router (SPA).
#
# So o necessario para rotas client-side (/exames/:id, /pacientes/:id) nao
# darem 404 ao serem acessadas direto pela URL ou apos F5. NADA de headers de
# seguranca aqui de proposito - V-12 (sem CSP/HSTS/X-Frame-Options) e V-13
# (sem TLS) permanecem intactos; isso e conteudo do gate de DAST.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
