<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .ent { fill:#f2f2f2; stroke:#333; stroke-width:1.5 }
      .proc { fill:#fff; stroke:#333; stroke-width:1.5 }
      .store { stroke:#333; stroke-width:1.5 }
      .fluxo { stroke:#333; stroke-width:1.2; fill:none; marker-end:url(#seta) }
      .tb { stroke:#c00; stroke-width:2; stroke-dasharray:8 6 }
      .rot { fill:#222 }
      .bg { fill:#fff }
      .tbtxt { fill:#c00; font-size:11; font-weight:bold }
      .t { text-anchor:middle }
      .nota { fill:#fff6bf; stroke:#b08d00; stroke-width:1 }
      .liga { stroke:#b08d00; stroke-width:1; stroke-dasharray:2 2 }
      .ntxt { fill:#5a4700; font-size:10.5; font-weight:bold; text-anchor:middle }
      .nsub { fill:#5a4700; font-size:9.5; text-anchor:middle }
    </style>
  </defs>

  <!-- Fronteiras de confiança -->
  <line class="tb" x1="380" y1="30" x2="380" y2="645"/>
  <line class="tb" x1="625" y1="30" x2="625" y2="645"/>
  <text class="tbtxt t" x="380" y="20">fronteira: navegador | servidor</text>
  <text class="tbtxt t" x="625" y="20">fronteira: API | banco</text>
  <text class="t" x="190" y="637" fill="#777" font-size="11">zona 1 — não confiável (navegador)</text>
  <text class="t" x="502" y="637" fill="#777" font-size="11">zona 2 — confiável (servidor)</text>
  <text class="t" x="760" y="637" fill="#777" font-size="11">zona 3 — restrita (dados)</text>

  <!-- Entidades externas (retângulos) -->
  <rect class="ent" x="15" y="60" width="125" height="50"/>
  <text class="t" x="77" y="81">Usuário</text><text class="t" x="77" y="97" font-size="10">(qualquer papel)</text>
  <rect class="ent" x="15" y="210" width="125" height="50"/>
  <text class="t" x="77" y="239">Recepção</text>
  <rect class="ent" x="15" y="380" width="125" height="50"/>
  <text class="t" x="77" y="409">Médico</text>

  <!-- Processos (círculos numerados) -->
  <circle class="proc" cx="275" cy="405" r="48"/>
  <text class="t" x="275" y="398">4.0</text><text class="t" x="275" y="414">Exibir</text><text class="t" x="275" y="428">prontuário</text>
  <circle class="proc" cx="500" cy="85" r="52"/>
  <text class="t" x="500" y="81">1.0</text><text class="t" x="500" y="97">Autenticar</text>
  <circle class="proc" cx="500" cy="235" r="52"/>
  <text class="t" x="500" y="227">2.0</text><text class="t" x="500" y="243">Buscar</text><text class="t" x="500" y="257">pacientes</text>
  <circle class="proc" cx="500" cy="405" r="52"/>
  <text class="t" x="500" y="397">3.0</text><text class="t" x="500" y="413">Obter nota</text><text class="t" x="500" y="427">clínica</text>

  <!-- Armazenamentos (duas linhas) -->
  <line class="store" x1="200" y1="135" x2="345" y2="135"/><line class="store" x1="200" y1="165" x2="345" y2="165"/>
  <text class="t" x="272" y="154">D4 localStorage</text>
  <line class="store" x1="700" y1="70" x2="880" y2="70"/><line class="store" x1="700" y1="100" x2="880" y2="100"/>
  <text class="t" x="790" y="89">D1 usuario</text>
  <line class="store" x1="700" y1="220" x2="880" y2="220"/><line class="store" x1="700" y1="250" x2="880" y2="250"/>
  <text class="t" x="790" y="239">D2 paciente</text>
  <line class="store" x1="700" y1="390" x2="880" y2="390"/><line class="store" x1="700" y1="420" x2="880" y2="420"/>
  <text class="t" x="790" y="409">D3 nota_clinica</text>

  <!-- Fluxos: login -->
  <path class="fluxo" d="M140,75 L448,75"/>
  <rect class="bg" x="232" y="58" width="86" height="14"/><text class="rot t" x="275" y="69">e-mail e senha</text>
  <path class="fluxo" d="M462,121 L345,150"/>
  <rect class="bg" x="352" y="112" width="96" height="14"/><text class="rot t" x="400" y="123">token de sessão</text>
  <path class="fluxo" d="M552,78 L700,78"/>
  <rect class="bg" x="572" y="50" width="108" height="14"/><text class="rot t" x="626" y="61">consulta credencial</text>
  <path class="fluxo" d="M700,92 L552,92"/>
  <rect class="bg" x="574" y="103" width="104" height="14"/><text class="rot t" x="626" y="114">dados do usuário</text>

  <!-- Fluxos: busca -->
  <path class="fluxo" d="M140,226 L448,226"/>
  <rect class="bg" x="238" y="209" width="74" height="14"/><text class="rot t" x="275" y="220">nome ou CPF</text>
  <path class="fluxo" d="M448,246 L140,246"/>
  <rect class="bg" x="228" y="251" width="104" height="14"/><text class="rot t" x="280" y="262">lista de cadastros</text>
  <path class="fluxo" d="M552,228 L700,228"/>
  <rect class="bg" x="598" y="200" width="56" height="14"/><text class="rot t" x="626" y="211">consulta</text>
  <path class="fluxo" d="M700,242 L552,242"/>
  <rect class="bg" x="596" y="253" width="62" height="14"/><text class="rot t" x="626" y="264">cadastros</text>

  <!-- Fluxos: prontuário -->
  <path class="fluxo" d="M140,378 L227,378"/>
  <rect class="bg" x="148" y="367" width="72" height="14"/><text class="rot t" x="184" y="378">abre a ficha</text>
  <path class="fluxo" d="M227,394 L140,394"/>
  <rect class="bg" x="146" y="431" width="76" height="14"/><text class="rot t" x="184" y="442">nota exibida</text>
  <path class="fluxo" d="M321,372 L448,372"/>
  <rect class="bg" x="342" y="372" width="86" height="14"/><text class="rot t" x="385" y="383">id do paciente</text>
  <path class="fluxo" d="M448,398 L321,398"/>
  <rect class="bg" x="344" y="425" width="82" height="14"/><text class="rot t" x="385" y="436">texto da nota</text>
  <path class="fluxo" d="M552,378 L700,378"/>
  <rect class="bg" x="598" y="370" width="56" height="14"/><text class="rot t" x="626" y="381">consulta</text>
  <path class="fluxo" d="M700,392 L552,392"/>
  <rect class="bg" x="592" y="423" width="70" height="14"/><text class="rot t" x="626" y="434">nota clínica</text>
  <path class="fluxo" d="M345,165 L345,322 L311,353"/>
  <text class="rot" x="338" y="316" text-anchor="end">token (enviado</text><text class="rot" x="338" y="329" text-anchor="end">nas requisições)</text>

  <!-- Requisitos como nota no elemento que protegem (slide 5 da Aula 3) -->
  <line class="liga" x1="500" y1="137" x2="500" y2="144"/>
  <rect class="nota" x="438" y="144" width="124" height="18"/><text class="ntxt" x="500" y="157">REQ-AUTH-SQLI-01</text>
  <line class="liga" x1="500" y1="287" x2="500" y2="293"/>
  <rect class="nota" x="436" y="293" width="128" height="46"/><text class="ntxt" x="500" y="306">REQ-INJ-BUSCA-01</text><text class="ntxt" x="500" y="320">REQ-AUTH-BUSCA-01</text><text class="ntxt" x="500" y="334">REQ-PRIV-BUSCA-01</text>
  <line class="liga" x1="500" y1="457" x2="500" y2="466"/>
  <rect class="nota" x="410" y="466" width="180" height="32"/><text class="ntxt" x="500" y="479">REQ-INJ-01</text><text class="nsub" x="500" y="492">(vale para 1.0, 2.0, 3.0 e 5.0)</text>
  <line class="liga" x1="275" y1="453" x2="275" y2="466"/>
  <rect class="nota" x="230" y="466" width="90" height="18"/><text class="ntxt" x="275" y="479">REQ-XSS-01</text>
  <line class="liga" x1="790" y1="250" x2="790" y2="270"/>
  <rect class="nota" x="715" y="270" width="150" height="32"/><text class="ntxt" x="790" y="283">REQ-PRIV-ANON-01</text><text class="nsub" x="790" y="296">(D2 e D3)</text>

  <!-- Recuperação de senha (acrescentada na Fase 4: o inventário achou injeção no porEmail) -->
  <rect class="ent" x="15" y="545" width="125" height="50"/>
  <text class="t" x="77" y="566">Usuário</text><text class="t" x="77" y="582" font-size="10">(esqueceu a senha)</text>
  <circle class="proc" cx="500" cy="570" r="48"/>
  <text class="t" x="500" y="562">5.0</text><text class="t" x="500" y="578">Recuperar</text><text class="t" x="500" y="592">senha</text>
  <line class="store" x1="700" y1="555" x2="880" y2="555"/><line class="store" x1="700" y1="585" x2="880" y2="585"/>
  <text class="t" x="790" y="574">D1 usuario (cópia)</text>
  <path class="fluxo" d="M140,560 L452,560"/>
  <rect class="bg" x="253" y="543" width="44" height="14"/><text class="rot t" x="275" y="554">e-mail</text>
  <path class="fluxo" d="M452,582 L140,582"/>
  <rect class="bg" x="205" y="587" width="140" height="14"/><text class="rot t" x="275" y="598">resposta + token de reset</text>
  <path class="fluxo" d="M548,563 L700,563"/>
  <rect class="bg" x="580" y="535" width="94" height="14"/><text class="rot t" x="626" y="546">consulta e-mail</text>
  <path class="fluxo" d="M700,577 L548,577"/>
  <rect class="bg" x="588" y="588" width="76" height="14"/><text class="rot t" x="626" y="599">id do usuário</text>
</svg>
