name: SSDLC - VidaPlus

# Pipeline de seguranca do projeto. Cada job e um GATE mapeado a uma fase do SSDLC.
# No legado, quase todos os gates ficam VERMELHOS de proposito (informativo).
# Conforme os grupos corrigem, os gates ficam VERDES. Para tornar um gate BLOQUEANTE,
# remova o 'continue-on-error: true' correspondente (ver docs/06-pipeline-cicd.md).

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # para publicar SARIF (CodeQL/Semgrep) na aba Security

jobs:

  # ---------- Fase 4/5: build ----------
  build-backend:
    name: Build backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar e testar (exclui testes @security, que rodam no gate proprio com MySQL)
        working-directory: legacy-app/backend
        run: mvn -B -q verify -DexcludedGroups=security

  build-frontend:
    name: Build frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar e build
        working-directory: legacy-app/frontend
        run: |
          npm install || true
          npm run build || echo "build incompleto (esperado no legado)"

  # ---------- Gate: Secret Scanning (V-05) - LGPD art. 46 ----------
  secret-scan:
    name: "Gate - Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    continue-on-error: true    # informativo no legado; deve acusar application.properties/JwtUtil
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: security/gitleaks/gitleaks.toml

  # ---------- Gate: SAST (V-01,V-02,V-07,V-10) ----------
  sast-semgrep:
    name: "Gate - SAST (Semgrep)"
    runs-on: ubuntu-latest
    continue-on-error: true
    container: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (regras OWASP + Java + custom)
        run: semgrep scan --config p/owasp-top-ten --config p/java --config security/semgrep/vidaplus.yml --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: semgrep.sarif }

  sast-codeql:
    name: "Gate - SAST (CodeQL)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "java,javascript" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Build para CodeQL
        working-directory: legacy-app/backend
        run: mvn -B -q -DskipTests package
      - uses: github/codeql-action/analyze@v3

  # ---------- Gate: SCA / dependencias - higiene de supply chain ----------
  sca:
    name: "Gate - SCA (Dependency-Check + Trivy)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: vidaplus
          path: legacy-app
          format: SARIF
          args: >-
            --suppression security/dependency-check/suppression.xml
            --failOnCVSS 7
      - name: Trivy (filesystem + libs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: legacy-app
          severity: HIGH,CRITICAL
          exit-code: "0"     # informativo no legado

  # ---------- Gate: Container Scanning (imagens backend/frontend) ----------
  container-scan:
    name: "Gate - Container Scanning (Trivy image)"
    runs-on: ubuntu-latest
    continue-on-error: true    # informativo no legado; CVEs na imagem base/SO
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens
        run: |
          docker build -t vidaplus-backend:ci legacy-app/backend
          docker build -t vidaplus-frontend:ci legacy-app/frontend
      - name: Trivy - imagem do backend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: vidaplus-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "0"     # vira "1" quando o grupo tornar o gate bloqueante
      - name: Trivy - imagem do frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: vidaplus-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "0"

  # ---------- Gate: SBOM (Fase 6) ----------
  sbom:
    name: "SBOM (CycloneDX)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar SBOM com Syft
        uses: anchore/sbom-action@v0
        with:
          path: legacy-app
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }

  # ---------- Gate: DAST autenticado (V-03 IDOR, V-09, V-12) - roda contra a app viva ----------
  dast-zap:
    name: "Gate - DAST autenticado (OWASP ZAP)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Subir ambiente
        working-directory: legacy-app
        run: |
          docker compose up -d --build
          echo "aguardando API..."; sleep 40
      - name: Obter token JWT (usuario de teste)
        id: auth
        # Login do seed (ver legacy-app/db/seed.sql). Ajuste se o grupo mudar o endpoint/credenciais.
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"dra.house@vidaplus.local","senha":"Medico123"}' | jq -r '.access_token // empty')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: "ZAP Baseline autenticado (injeta header Authorization)"
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8080"
          rules_file_name: security/zap/rules.tsv
          # -a: alfa rules; replacer: adiciona o header Authorization em toda requisicao,
          # permitindo o ZAP navegar endpoints autenticados e exercitar o IDOR (V-03).
          cmd_options: >-
            -a -z "-config replacer.full_list(0).description=auth
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Authorization
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=Bearer ${{ steps.auth.outputs.token }}"
      - name: Derrubar ambiente
        if: always()
        working-directory: legacy-app
        run: docker compose down -v

  # ---------- Gate: testes de seguranca (IDOR/RBAC/auth/auditoria) ----------
  security-tests:
    name: "Gate - Testes de seguranca"
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: vidaplus
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot123"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Carregar schema + seed no MySQL de teste
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          mysql -h127.0.0.1 -uroot -proot123 < legacy-app/db/schema.sql
          mysql -h127.0.0.1 -uroot -proot123 vidaplus < legacy-app/db/seed.sql
      - name: Testes de aceite de seguranca (@Tag security)
        working-directory: legacy-app/backend
        # No legado FALHA de proposito (gate vermelho); fica verde quando corrigido.
        run: mvn -B -q test -Dgroups=security

  # ---------- Placar dos gates (resumo) ----------
  gate-summary:
    name: "Placar de gates SSDLC"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-semgrep, sca, container-scan, dast-zap, security-tests]
    if: always()
    steps:
      - name: Resumo
        run: |
          echo "## Placar de gates SSDLC - VidaPlus" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Fase | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | 4/6 | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Semgrep)  | 4/5 | ${{ needs.sast-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA             | 5/6 | ${{ needs.sca.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan  | 5/6 | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST autenticado| 5   | ${{ needs.dast-zap.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Testes seg.     | 5   | ${{ needs.security-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Meta do semestre: mover cada gate de vermelho para verde." >> $GITHUB_STEP_SUMMARY
