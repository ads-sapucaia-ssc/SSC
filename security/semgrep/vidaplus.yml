# Regras Semgrep customizadas para o VidaPlus.
# Focam nas classes de falha plantadas, para o gate de SAST acusar de forma didatica.
rules:
  - id: vidaplus-sql-concat
    languages: [java]
    severity: ERROR
    message: >-
      Possivel SQL Injection (V-01): trecho de SQL concatenado com uma VARIAVEL.
      Use PreparedStatement/JdbcTemplate parametrizado (?). Quebrar um SQL
      constante em varias linhas com + nao e acusado.
    patterns:
      - pattern-regex: '"[^"\n]*\b(WHERE|AND|OR|SET|LIKE|VALUES)\b[^"\n]*"\s*\+\s*[A-Za-z_]'

  - id: vidaplus-weak-hash-md5
    languages: [java]
    severity: ERROR
    message: "Hash fraco (V-02): MD5/SHA-1 para senha. Use Argon2id/bcrypt com salt."
    patterns:
      - pattern: MessageDigest.getInstance("MD5")

  - id: vidaplus-jwt-no-expiration
    languages: [java]
    severity: WARNING
    message: "JWT sem expiracao (V-07): faltou .expiration(...). Token eterno."
    patterns:
      - pattern: Jwts.builder(). ... .compact()
      - pattern-not: Jwts.builder(). ... .expiration(...). ... .compact()

  - id: vidaplus-hardcoded-secret
    languages: [java]
    severity: ERROR
    message: "Segredo hardcoded (V-05): mova para variavel de ambiente/cofre."
    patterns:
      - pattern-regex: (SECRET|PASSWORD|SENHA)\s*=\s*"[^"]{6,}"

  - id: vidaplus-react-dangerous-html
    languages: [javascript, typescript]
    severity: ERROR
    message: "XSS (V-10): dangerouslySetInnerHTML com conteudo nao confiavel (React)."
    patterns:
      - pattern-regex: 'dangerouslySetInnerHTML\s*='
